                  incorrectFeedback:
                    "Remorse alone doesn’t justify unbanning. The evidence needs to be reviewed first."
                },
                {
                  text: "Deny the appeal, but thank them for their apology.",
                  correct: false,
                  incorrectFeedback:
                    "This isn't a sufficient reason to deny the appeal. The evidence must be the deciding factor."
                }
              ]
            },
            {
              prompt:
                "The agent checks the ban sheet and can’t find the player’s ban listed. What should they do?",
              responses: [
                {
                  text: "Unban the player if the ban wasn’t logged by Steven or Codie.",
                  correct: true,
                  feedback:
                    "Correct. If the ban isn’t listed and it’s not from Steven or Codie, the player can be unbanned."
                },
                {
                  text: "Deny the appeal and close the chat.",
                  correct: false,
                  incorrectFeedback:
                    "This is incorrect. If the ban isn’t logged and wasn’t issued by Steven or Codie, you should proceed with unbanning."
                },
                {
                  text: "Escalate the issue to Steven or Codie.",
                  correct: false,
                  incorrectFeedback:
                    "Escalation isn't necessary unless it’s a serious or unmarked ban made by them."
                }
              ]
            },
            {
              prompt:
                "You check the ban history and find that the player was banned by Steven. What should you do next?",
              responses: [
                {
                  text: "Reach out to Steven for further guidance.",
                  correct: true,
                  feedback:
                    "Correct. If Steven issued the ban, you need to check with them before proceeding."
                },
                {
                  text: "Proceed with the appeal and unban the player.",
                  correct: false,
                  incorrectFeedback:
                    "This is incorrect. Since Steven issued the ban, you need to check with them first."
                },
                {
                  text: "Deny the appeal immediately.",
                  correct: false,
                  incorrectFeedback:
                    "Not necessary. You must first confirm with Steven before deciding."
                }
              ]
            },
            {
              prompt:
                "After reviewing all the information, and checking with Steven, you’ve both decided to unban the player. What should you do next?",
              responses: [
                {
                  text: "Use the unban command and log the unban in the Ban Sheet.",
                  correct: true,
                  feedback:
                    "Correct. You need to officially unban the player and record it in the Ban Sheet. Once you’ve done that, confirm the action taken with the player and close their chat when ready."
                },
                {
                  text: "Close the chat without confirming the unban.",
                  correct: false,
                  incorrectFeedback:
                    "It’s important to confirm the action taken with the player before closing the chat."
                },
                {
                  text: "Deny the appeal but thank the player for their time.",
                  correct: false,
                  incorrectFeedback:
                    "If the decision is to unban, you should proceed with unbanning, not denying."
                }
              ]
            }
          ]
        }
      ];
      
      function SupportScenarioSelector() {
        // --- All hooks at the top ---
        const [accessibilityMode, setAccessibilityMode] = useState(() => {
          const stored = window.localStorage.getItem('accessibilityMode');
          return stored === 'true';
        });
        const [bionicReading, setBionicReading] = useState(() => {
          const stored = window.localStorage.getItem('bionicReading');
          return stored === 'true';
        });
        const [accessAnnouncement, setAccessAnnouncement] = useState('');
        
        
        
        
        
        
        
        
        
        
        
        const [tipDismissed, setTipDismissed] = useState(false);
        const [selectedResponseIdx, setSelectedResponseIdx] = useState(null);
        const [selectedScenarioIndex, setSelectedScenarioIndex] = useState(null);
        const [currentStageIndex, setCurrentStageIndex] = useState(0);
        const [messages, setMessages] = useState([]);
        const [shuffledResponses, setShuffledResponses] = useState([]);
        const [score, setScore] = useState(0);
        const [totalQuestions, setTotalQuestions] = useState(0);
        const [answeredQuestions, setAnsweredQuestions] = useState({});
        const [isWaiting, setIsWaiting] = useState(false);
        const [finished, setFinished] = useState(false);
        const chatEndRef = useRef(null);
        // --- End hooks ---


        // Keyboard support for answer selection
        useEffect(() => {
          function onKeyDown(e) {
            if (["1", "2", "3"].includes(e.key)) {
              const idx = parseInt(e.key, 10) - 1;
              const currentStage = selectedScenarioIndex !== null ? scenarios[selectedScenarioIndex].stages[currentStageIndex] : null;
              if (currentStage && currentStage.responses && currentStage.responses[idx] && !isWaiting) {
                handleAnswerClick(currentStage.responses[idx]);
              }
            }
          }
          if (selectedScenarioIndex === null || isWaiting) return;
          window.addEventListener('keydown', onKeyDown);
          return () => window.removeEventListener('keydown', onKeyDown);
        }, [selectedScenarioIndex, currentStageIndex, isWaiting]);

        // Bionic reading helper
        function bionicify(text) {
          if (!bionicReading) return text;
          return text.split(/(\s+)/).map((word, i) => {
            if (/^\s+$/.test(word)) return word;
            // Only bold alphabetic words
            if (!/\w/.test(word)) return word;
            const splitIdx = word.length > 3 ? 2 : 1;
            return <><b key={i}>{word.slice(0, splitIdx)}</b>{word.slice(splitIdx)}</>;
          });
        }
        
        
        
        
        
        
        
        
        
        
        
      
        // Scroll to the most recent message when messages update.
        useEffect(() => {
          chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
        }, [messages]);
      
        // Helper function to add a message.
        const addMessage = (msg) => {
          setMessages((prev) => [...prev, msg]);
        };
      
        // Function to shuffle responses on every new stage.
        const shuffleResponses = (scenarioIndex, stageIndex) => {
          const responses = [...scenarios[scenarioIndex].stages[stageIndex].responses];
          for (let i = responses.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [responses[i], responses[j]] = [responses[j], responses[i]];
          }
          setShuffledResponses(responses);
        };
      
        // Handle selecting a scenario.
        const handleScenarioSelect = (index) => {
          setSelectedScenarioIndex(index);
          setCurrentStageIndex(0);
          setMessages([]);
          setFinished(false);
          setScore(0);
          setAnsweredQuestions({});
          setTotalQuestions(scenarios[index].stages.length);
          setSelectedResponseIdx(null);
          const prompt = scenarios[index].stages[0].prompt;
          addMessage({ from: "system", text: prompt });
          shuffleResponses(index, 0);
        };
      
        // Function to handle when an answer is clicked
        const handleAnswerClick = (response) => {
          if (isWaiting) return;
          setIsWaiting(true);
      
          const questionId = `${selectedScenarioIndex}-${currentStageIndex}`;
          const isCorrect = response.correct;
          let isFirstAttempt = true;
          
          // Check if this question was already answered
          if (answeredQuestions[questionId]) {
            isFirstAttempt = false;
            // Don't proceed if they already got it right
            if (answeredQuestions[questionId].isCorrect) {
              setIsWaiting(false);
              return;
            }
          }
          
          // Mark this question as answered
          setAnsweredQuestions(prev => ({
            ...prev,
            [questionId]: {
              isCorrect,
              isFirstAttempt: isFirstAttempt && !answeredQuestions[questionId]?.isFirstAttempt
            }
          }));
          
          // Only increment score if correct on first attempt
          if (isCorrect && isFirstAttempt) {
            setScore(prevScore => prevScore + 1);
          }
      
          // Append the user's answer
          addMessage({ from: "user", text: response.text });
      
          // Provide feedback
          const feedback = isCorrect
            ? response.feedback || "That's correct!"
            : response.incorrectFeedback || "That's not quite right. Try again!";
      
          const type = isCorrect ? "correct" : "incorrect";
          addMessage({ from: "system", text: feedback, type: type });
          
          if (isCorrect) {
            // Only move to next question if answer is correct
            const moveToNextQuestion = () => {
              if (currentStageIndex < scenarios[selectedScenarioIndex].stages.length - 1) {
                // Move to the next stage
                const nextStageIndex = currentStageIndex + 1;
                setCurrentStageIndex(nextStageIndex);
                const prompt = scenarios[selectedScenarioIndex].stages[nextStageIndex].prompt;
                addMessage({ from: "system", text: prompt });
                shuffleResponses(selectedScenarioIndex, nextStageIndex);
              } else {
                // No more stages, show final score
                setFinished(true);
                showFinalScore();
              }
              setIsWaiting(false);
            };
            
            // Add a small delay before moving to next question
            setTimeout(moveToNextQuestion, 1000);
          } else {
            // If answer was wrong, just re-enable the buttons after a short delay
            setTimeout(() => setIsWaiting(false), 1000);
          }
        };
      
        // Function to reset the quiz to the scenario selection screen
        const resetQuiz = () => {
          setSelectedScenarioIndex(null);
          setCurrentStageIndex(0);
          setMessages([]);
          setFinished(false);
          setScore(0);
          setAnsweredQuestions({});
        };
        
        // Function to show the final score
        const showFinalScore = () => {
          // Force a re-render to ensure we have the latest score
          setScore(prevScore => {
            const finalScore = prevScore;
            const percentage = Math.round((finalScore / totalQuestions) * 100);
            let message = `Quiz Complete! You scored ${finalScore} out of ${totalQuestions} (${percentage}%)`;
            
            if (percentage >= 90) {
              message += " 🎉 Excellent work!";
            } else if (percentage >= 70) {
              message += " 👍 Good job!";
            } else {
              message += " Keep practicing!";
            }
            
            addMessage({ from: "system", text: message, type: "score" });
            return prevScore; // Return the same score to avoid changing it
          });
        };
      
        // Return to the scenario selection menu.
        const handleBackToMenu = () => {
          setSelectedScenarioIndex(null);
          setCurrentStageIndex(0);
          setMessages([]);
          setShuffledResponses([]);
          setFinished(false);
        };
      
        // Reset selectedResponseIdx when question changes
        useEffect(() => {
          setSelectedResponseIdx(null);
        }, [currentStageIndex, selectedScenarioIndex]);

        if (selectedScenarioIndex === null) {
          return (
            <div className={`flex flex-col gap-4 items-center justify-center flex-1 ${accessibilityMode ? 'text-xl' : ''}`}>
              <div className="flex justify-between w-full items-center mb-2">
                <h1 className={`font-bold ${accessibilityMode ? 'text-3xl' : 'text-2xl'}`}>{bionicify('Support Scenario Selector')}</h1>
                <div className="flex gap-2 items-center">
                  <button
                    id="accessibility-toggle"
                  onClick={() => {
                    setAccessibilityMode((v) => {
                      const next = !v;
                      window.localStorage.setItem('accessibilityMode', next);
                      setAccessAnnouncement(next ? 'Accessibility mode enabled' : 'Accessibility mode disabled');
                      return next;
                    });
                  }}
                  className={`ml-2 px-3 py-1 rounded border text-sm transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-green-400 ${accessibilityMode ? 'bg-green-600 text-white border-green-600' : 'bg-gray-200 text-gray-700 border-gray-400'}`}
                  aria-pressed={accessibilityMode}
                  aria-label={accessibilityMode ? 'Disable accessibility mode' : 'Enable accessibility mode for high contrast and keyboard focus'}
                  aria-labelledby="accessibility-toggle accessibility-toggle-desc"
                  title="Toggle accessibility mode for high contrast and improved keyboard navigation"
                >
                  <span aria-hidden="true" className="mr-2" role="img">♿</span>
                  {accessibilityMode ? 'Accessibility: ON' : 'Accessibility: OFF'}
                </button>
                  <button
                    id="bionic-toggle"
                  onClick={() => {
                    setBionicReading((v) => {
                      const next = !v;
                      window.localStorage.setItem('bionicReading', next);
                      return next;
                    });
                  }}
                  className={`ml-2 px-3 py-1 rounded border text-sm transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-green-400 ${bionicReading ? 'bg-green-600 text-white border-green-600' : 'bg-gray-200 text-gray-700 border-gray-400'}`}
                  aria-pressed={bionicReading}
                  aria-label={bionicReading ? 'Disable bionic reading mode' : 'Enable bionic reading mode for easier reading' }
                  aria-labelledby="bionic-toggle bionic-toggle-desc"
                  title="Toggle bionic reading mode for easier reading"
                >
                  <span aria-hidden="true" className="mr-2" role="img">🔤</span>
                  {bionicReading ? 'Bionic: ON' : 'Bionic: OFF'}
                </button>
                <span id="bionic-toggle-desc" className="sr-only">Toggles bionic reading mode for easier reading</span>
                </div>
                <span id="accessibility-toggle-desc" className="sr-only">Toggles high contrast and keyboard focus accessibility mode</span>
                <div aria-live="polite" className="sr-only">{accessAnnouncement}</div>
              </div>
              <label htmlFor="scenario-list" className="sr-only">Choose a scenario</label>
              <div id="scenario-list" className="grid grid-cols-1 gap-2 w-full">
                {scenarios.map((scenario, idx) => (
                  <button
                    className={`w-full py-2 px-4 rounded shadow text-left transition-colors duration-150 
                      ${accessibilityMode 
                        ? `bg-white hover:bg-blue-100 border border-gray-200 ${selectedScenarioIndex === idx ? 'ring-2 ring-blue-400' : ''} focus:outline-none focus:ring-2 focus:ring-blue-400 text-2xl` 
                        : `bg-blue-500 hover:bg-blue-600 text-white`}
                    `}
                    onClick={() => handleScenarioSelect(idx)}
                    key={idx}
                    tabIndex={0}
                    aria-label={`Select scenario: ${bionicify(scenario.title)}`}
                  >
                    {bionicify(scenario.title)}
                  </button>
                ))}
              </div>
            </div>
          );
        }
      
        return (
  <main role="main" className={`max-w-xl mx-auto flex flex-col px-2 sm:px-4 py-2 ${accessibilityMode ? 'text-xl' : ''} min-h-screen md:h-screen h-[100dvh]`}>
    {/* Header */}
    <div className="bg-blue-500 text-white text-center font-bold py-2 relative sticky top-0 z-10">
      <button 
        aria-label="Restart Quiz"
        onClick={resetQuiz}
        className="absolute left-2 top-2 bg-white text-blue-500 px-2 py-1 rounded text-sm hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-300"
      >
        ← Back to Menu
      </button>
      <div className={accessibilityMode ? 'text-2xl font-bold' : ''}>
        {scenarios[selectedScenarioIndex].title}
        <div className={`w-full px-4 py-2 ${accessibilityMode ? 'text-lg' : 'text-xs text-gray-700'}`}>
          {totalQuestions > 0 && !finished && (
            <>
              <div className={`mb-1 font-medium ${accessibilityMode ? 'text-lg' : 'text-xs text-gray-700'}`}>
                {bionicify(`Question ${currentStageIndex + 1} of ${totalQuestions}`)}
              </div>
              <div className={`w-full bg-gray-300 rounded-full h-4 ${accessibilityMode ? 'h-6' : ''}`}
                aria-label={`Progress: Question ${currentStageIndex + 1} of ${totalQuestions}`}
                role="progressbar"
                aria-valuenow={currentStageIndex + 1}
                aria-valuemin={1}
                aria-valuemax={totalQuestions}
              >
                <div
                  className={`bg-white h-4 rounded-full transition-all duration-300 ${accessibilityMode ? 'h-6' : ''}`}
                  style={{ width: `${((currentStageIndex + 1) / totalQuestions) * 100}%` }}
                ></div>
              </div>
            </>
          )}
        </div>
        {totalQuestions > 0 && (
          <div className={`font-normal ${accessibilityMode ? 'text-xl' : 'text-sm'}`}>
            {bionicify(`Score: ${score}/${totalQuestions} (${Math.round((score / totalQuestions) * 100)}%)`)}
          </div>
        )}
      </div>
    </div>
    {/* Chat/messages area */}
    <div className="flex-1 min-h-0 p-4 overflow-y-auto space-y-4 bg-gray-50" style={{maxHeight: 'calc(100dvh - 56px - 72px)'}}>
      {messages.map((msg, idx) => (
        <div key={idx} className={msg.from === "user" ? "text-right" : "text-left"}>
          <div
            className={`inline-block py-1 px-2 w-fit max-w-md whitespace-normal rounded-lg ${
              msg.from === "user"
                ? "bg-blue-500 text-white text-left"
                : msg.from === "system" && msg.type === "correct"
                ? "bg-green-200 border border-green-500 text-black px-2"
                : msg.from === "system" && msg.type === "incorrect"
                ? "bg-red-200 border border-red-500 text-black px-2"
                : msg.from === "system" && msg.type === "score"
                ? "bg-purple-100 text-center font-bold py-4 text-lg"
                : "bg-gray-200 text-black px-2"
            }`}
          >
            {bionicify(msg.text)}
          </div>
        </div>
      ))}
      {selectedResponseIdx !== null && (
        <>
          <div className={`mb-2 font-semibold break-words ${accessibilityMode ? 'text-2xl' : 'text-lg'}`}>{bionicify(currentStage.prompt)}</div>
          <div className={`mt-2 text-base font-medium ${accessibilityMode ? 'text-2xl' : 'text-lg'}`} aria-live="polite">
            {bionicify(feedbackMessage)}
          </div>
        </>
      )}
      <div ref={chatEndRef}></div>
    </div>
    {/* Footer */}
    <div className="p-4 bg-white shadow-inner fixed bottom-0 left-0 w-full max-w-xl mx-auto md:static md:w-auto md:max-w-none z-20 shrink-0">
      {finished ? (
        <button
          onClick={handleBackToMenu}
          className="w-full text-center px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded"
        >
          Back to Main Menu
        </button>
      ) : (
        <div className="grid gap-2">
          {!tipDismissed && (
            <div className={`mb-2 ${accessibilityMode ? 'text-lg' : 'text-xs text-gray-500'}`}>{bionicify('Tip: You can answer by clicking or by pressing 1, 2, or 3 on your keyboard.')}</div>
          )}
          {shuffledResponses.map((response, idx) => (
            <button
              key={idx}
              onClick={() => {
                setTipDismissed(true);
                handleAnswerClick(response);
              }}
              disabled={isWaiting}
              className={`w-full text-left px-4 py-2 rounded disabled:opacity-50 transition-colors duration-150 flex items-center gap-2
                ${accessibilityMode
                  ? 'bg-blue-700 text-white text-lg focus:outline-none focus:ring-4 focus:ring-yellow-400 border-2 border-yellow-300 hover:bg-blue-800'
                  : 'bg-blue-100 hover:bg-blue-200 text-base'}
              `}
              style={accessibilityMode ? { fontSize: '1.25rem' } : {}}
              title={`Press ${idx + 1} to select this answer`}
            >
              <span className={`flex-shrink-0 inline-block mr-2 rounded-full bg-gray-200 text-gray-700 border border-gray-400 px-2 py-0.5 text-xs font-bold ${accessibilityMode ? 'text-base bg-yellow-200 border-yellow-400' : ''}`}>{idx + 1}</span>
              <span className="flex-1 break-words">{bionicify(response.text)}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  </main>
);
      }
      
      ReactDOM.render(
        <SupportScenarioSelector />,
        document.getElementById("root")
      );
    </script>
  </body>
</html>
